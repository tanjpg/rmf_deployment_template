{{- if .Values.ENABLE_RMF -}}
---
apiVersion: v1
kind: Service
metadata:
  name: rmf-tinyrobot-fleet-adapter
  labels:
    app: rmf-tinyrobot-fleet-adapter
spec:
  selector:
    app: rmf-tinyrobot-fleet-adapter
  ports:
    - protocol: TCP
      port: 8006
      targetPort: 8006
      name: websocket-port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmf-tinyrobot-fleet-adapter
  labels:
    app: rmf-tinyrobot-fleet-adapter
spec:
  selector:
    matchLabels:
      app: rmf-tinyrobot-fleet-adapter
  template:
    metadata:
      labels:
        app: rmf-tinyrobot-fleet-adapter
    spec:
      containers:
        - name: rmf-tinyrobot-fleet-adapter
          image: {{ .Values.global.REGISTRY_RMF | default "localhost" }}/{{ .Values.rmf_sim.RMF_SIM_IMAGE }}:{{ .Values.global.DEPLOYMENT_IMAGE_TAG }}
          imagePullPolicy: IfNotPresent
          env:
            - name: {{ .Values.global.DDS_ENV | quote }}
              value: {{ .Values.global.DDS_CONFIG | quote }}
            - name: ROS_DOMAIN_ID
              value: {{ .Values.global.ROS_DOMAIN_ID | quote }}
            - name: RMW_IMPLEMENTATION
              value: {{ .Values.global.RMW_IMPLEMENTATION | quote }}
            - name: RMF_SERVER_URI
              value: {{ .Values.global.RMF_SERVER_URI | quote }}
            - name: NAV_GRAPH
              value: {{ printf "/opt/%s/%s/%s/nav_graphs/%s" .Values.rmf_sim.RMF_SIM_NS .Values.rmf.RMF_MAP_PATH .Values.rmf.RMF_BUILDING .Values.adapters.NAV_GRAPH_FILE | quote }}
              # value: "/opt/{{ .Values.rmf_sim.RMF_SIM_NS}}/{{ .Values.rmf.RMF_MAP_PATH}}/{{ .Values.rmf.RMF_BUILDING}}/nav_graphs/{{ .Values.adapters.NAV_GRAPH_FILE}}"
            - name: FLEET_ADAPTER_CONFIG
              value: {{ printf "/opt/%s/%s/%s/%s" .Values.rmf_sim.RMF_SIM_NS .Values.rmf.RMF_CONFIG_PATH .Values.rmf.RMF_BUILDING .Values.adapters.FLEET_ADAPTER_CONFIG_FILE | quote }}
              # value: "/opt/{{ .Values.rmf_sim.RMF_SIM_NS}}/{{ .Values.rmf.RMF_CONFIG_PATH}}/{{ .Values.rmf.RMF_BUILDING}}/{{ .Values.adapters.FLEET_ADAPTER_CONFIG_FILE}}"
            - name: RMF_USE_SIM_TIME
              value: {{ .Values.global.RMF_USE_SIM_TIME | quote }}
          command: ["/bin/bash"]
          args:
            - -c
            - |
              export JWT_PUBLIC_KEY="$(cat /etc/config/jwt-pub-key.pub)";
              source /ros_entrypoint.sh;
              
              ros2 launch rmf_demos_fleet_adapter fleet_adapter.launch.xml \
                use_sim_time:={{ .Values.global.RMF_USE_SIM_TIME }} \
                nav_graph_file:=$(NAV_GRAPH) \
                config_file:=$(FLEET_ADAPTER_CONFIG) \
                server_uri:={{ .Values.global.RMF_SERVER_URI }} &

              ros2 launch rmf_demos_gz simulation.launch.xml \
                headless:=true \
                map_name:="office" \
                gazebo_version:='8' \
                sim_update_rate:='100'
          volumeMounts:
            - mountPath: {{ .Values.global.DDS_CONFIG_MOUNTPATH | quote }}
              name: {{ .Values.global.DDS_CONFIG_VOLUME | quote }}
            - mountPath: /etc/config
              name: jwt-pub-key
              readOnly: true
      volumes:
        - name: {{ .Values.global.DDS_CONFIG_VOLUME | quote }}
          configMap:
            name: {{ .Values.global.DDS_CONFIG_VOLUME | quote }}
        - name: jwt-pub-key
          configMap:
            name: jwt-pub-key
      tolerations:
        - key: reserved
          operator: Equal
          value: rmf
          effect: NoSchedule
{{- end -}}
